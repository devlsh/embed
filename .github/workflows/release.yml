name: "🚀 release"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        type: choice
        options:
          - prepare
          - publish

permissions: {}

concurrency:
  group: embed-release
  cancel-in-progress: false

jobs:
  release:
    name: "🏷️ prepare or create"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: "🛡️ validate release dispatch"
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          case "$OPERATION" in
            prepare|publish) ;;
            *) echo "Operation must be prepare or publish" >&2; exit 1 ;;
          esac

      - name: "🏷️ prepare or create release"
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release.json
          manifest-file: .manifest.json
          skip-github-release: ${{ inputs.operation == 'prepare' }}
          skip-github-pull-request: ${{ inputs.operation == 'publish' }}

  publish:
    name: "📦 publish package"
    needs: release
    if: inputs.operation == 'publish' && needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: "📥 check out release"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: "⚙️ set up node and pnpm"
        uses: devlsh/tools/github/setup@5a43d10d4535a7cf1368acd9313e70d417ac6235

      - name: "📦 publish"
        run: pnpm publish --access public --tag latest --provenance --no-git-checks
