# Run `lefthook` through `devenv` so it inherits the correct tooling.
lefthook: devenv shell lefthook

pre-commit:
  parallel: false
  piped: true

  commands:
    oxlint:
      priority: 1
      glob: '*.{ts,tsx,js,jsx}'
      exclude: 'src/oxlint/anti-slop/**'
      run: pnpm exec oxlint --fix --deny-warnings --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    oxfmt-source:
      priority: 2
      glob: '*.{ts,tsx,js,jsx}'
      exclude: 'src/oxlint/anti-slop/**'
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    oxfmt-content:
      priority: 3
      glob: '*.{json,jsonc,md}'
      exclude: 'src/oxlint/anti-slop/**'
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: false

  commands:
    check:
      run: pnpm check
